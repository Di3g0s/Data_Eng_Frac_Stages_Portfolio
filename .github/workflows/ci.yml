name: WITS transport tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q WITS_starter
      - name: Run synthetic transport and adapter tests
        run: python -m unittest discover -s WITS_starter -p 'test_*.py' -v
